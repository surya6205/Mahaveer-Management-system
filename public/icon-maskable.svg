<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="blueGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="shieldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#bgGradM)" />

  <!-- Center Content scaled inside 80% safe zone -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Outer Ring -->
    <circle cx="256" cy="225" r="160" fill="none" stroke="url(#blueGradM)" stroke-width="3" opacity="0.4" stroke-dasharray="6 8" />

    <!-- Inner Brand Shield / Emblem -->
    <path d="M 256 80 L 375 125 C 375 235 256 330 256 330 C 256 330 137 235 137 125 Z" 
          fill="url(#shieldGradM)" 
          stroke="url(#accentGradM)" 
          stroke-width="6" />

    <!-- Bold 'M' Monogram in Shield -->
    <path d="M 185 255 L 185 145 L 225 213 L 256 167 L 287 213 L 327 145 L 327 255 L 302 255 L 302 190 L 270 237 L 242 237 L 210 190 L 210 255 Z" 
          fill="#ffffff" />

    <!-- Aerodynamic Transport Truck Symbol Overlay -->
    <g transform="translate(146, 275) scale(0.43)">
      <rect x="-30" y="150" width="580" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
      <rect x="0" y="20" width="290" height="115" rx="12" fill="url(#blueGradM)" stroke="#60a5fa" stroke-width="3" />
      <line x1="60" y1="25" x2="60" y2="130" stroke="#1d4ed8" stroke-width="4" />
      <line x1="120" y1="25" x2="120" y2="130" stroke="#1d4ed8" stroke-width="4" />
      <line x1="180" y1="25" x2="180" y2="130" stroke="#1d4ed8" stroke-width="4" />
      <line x1="240" y1="25" x2="240" y2="130" stroke="#1d4ed8" stroke-width="4" />

      <path d="M 292 60 L 360 60 L 400 95 L 400 135 L 292 135 Z" fill="url(#accentGradM)" stroke="#ea580c" stroke-width="3" />
      <path d="M 320 68 L 355 68 L 388 95 L 320 95 Z" fill="#e0f2fe" opacity="0.95" />

      <circle cx="55" cy="140" r="26" fill="#090d16" stroke="#475569" stroke-width="4" />
      <circle cx="55" cy="140" r="10" fill="#94a3b8" />
      <circle cx="120" cy="140" r="26" fill="#090d16" stroke="#475569" stroke-width="4" />
      <circle cx="120" cy="140" r="10" fill="#94a3b8" />
      <circle cx="355" cy="140" r="26" fill="#090d16" stroke="#475569" stroke-width="4" />
      <circle cx="355" cy="140" r="10" fill="#94a3b8" />
    </g>

    <!-- Bottom Brand Text -->
    <text x="256" y="420" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="30" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#f8fafc" 
          text-anchor="middle">MAHAVEER</text>
    <text x="256" y="448" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="15" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#f97316" 
          text-anchor="middle">MANAGEMENT SYSTEM</text>
  </g>
</svg>